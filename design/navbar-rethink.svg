</defs><rect width="620" height="578" fill="#07070d"/><text x="18" y="30" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15.5" font-weight="800" fill="#F5C842">Navbar repensada do zero - 3 conceitos (acento ambar)</text><text x="22" y="64" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="800" fill="#fff">1 · Ilha flutuante + rótulo ativo</text><rect x="272.79999999999995" y="51" width="118" height="18" rx="9" fill="rgba(245,200,66,.16)"/><text x="283.79999999999995" y="64" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="800" fill="#F5C842">RECOMENDADO</text><text x="22" y="84" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="500" fill="#9aa0ab">Flutua sobre o conteúdo. Só o ativo tem texto (cápsula âmbar); resto ícone-só.</text><text x="22" y="100" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" fill="#6b7180">Porque: Premium e focado; destaca-se do fundo, identidade forte.</text><g filter="url(#islandShadow)"><rect x="24" y="120" width="572" height="78" rx="26" fill="#15171f" stroke="rgba(255,255,255,.08)"/></g><rect x="40" y="140" width="104" height="38" rx="19" fill="rgba(245,200,66,.16)"/><g transform="translate(70,159) scale(0.9583333333333334) translate(-12,-12)" fill="none" stroke="#F5C842" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.4 12 2.6l9 6.8V20a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 20z"/><path d="M9.2 21.6V13.2h5.6v8.4"/></g><text x="90" y="164" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#F5C842">Hoje</text><g transform="translate(189.5,159) scale(0.9166666666666666) translate(-12,-12)" fill="none" stroke="#878d99" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.4" width="18" height="17" rx="3"/><path d="M16 2.4v4M8 2.4v4M3 9.4h18"