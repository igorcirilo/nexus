8)"/><circle cx="76.85714285714286" cy="323" r="19" fill="rgba(245,200,66,.18)" filter="url(#goldglow)"/><g transform="translate(76.85714285714286,323) scale(0.9166666666666666) translate(-12,-12)" fill="none" stroke="#F5C842" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.4 12 2.6l9 6.8V20a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 20z"/><path d="M9.2 21.6V13.2h5.6v8.4"/></g><text x="76.85714285714286" y="356" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.3" font-weight="700" fill="#F5C842">Hoje</text><g transform="translate(154.57142857142856,323) scale(0.9166666666666666) translate(-12,-12)" fill="none" stroke="#878d99" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.4" width="18" height="17" rx="3"/><path d="M16 2.4v4M8 2.4v4M3 9.4h18"/></g><text x="154.57142857142856" y="356" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.3" font-weight="500" fill="#878d99">Agenda</text><g transform="translate(232.28571428571428,323) scale(0.9166666666666666) translate(-12,-12)" fill="none" stroke="#878d99" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 10h8M5.5 13.6h8"/><path d="M15.5 5a8.5 8.5 0 1 0 0 14"/></g><text x="232.28571428571428" y="356" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.3" font-weight="500" fill="#878d99">Finanças</text><circle cx="310" cy="310" r="18" fill="url(#goldgrad)" stroke="#15171f" stroke-width="3"/><text x="310" y="318" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#241a00">+</text><g transform="translate(387.71428571428567,323) scale(0.9166666666666666) translate(-12,-12)" fill="none" stroke="#878d99" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9v6M17.5 9v6M9.5 7.5v9M14.5 7.5v9M9 12h6M4 10.5v3M20 10.5v3"/></g><text x="387.71428571428567" y="356" text-anchor="middle" font-