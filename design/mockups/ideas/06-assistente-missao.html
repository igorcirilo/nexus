<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  body{background:#07070F;padding:40px 22px;max-width:452px}
  .asst{position:relative;border-radius:22px;padding:18px;background:linear-gradient(135deg,rgba(127,119,221,.20),rgba(30,203,180,.10));border:1px solid rgba(127,119,221,.35);overflow:hidden}
  .glow{position:absolute;top:-40px;right:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(127,119,221,.45),transparent 70%)}
  .row1{position:relative;display:flex;align-items:center;gap:11px}
  .orb{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#9C94EC,#1ECBB4);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 0 18px rgba(127,119,221,.6);color:#fff}
  .row1 b{font-size:12.5px;font-weight:800;color:#D7D4FF;letter-spacing:.04em}
  .tag{margin-left:auto;font-size:10.5px;font-weight:700;color:#9BA0B0;background:rgba(255,255,255,.08);padding:4px 9px;border-radius:20px}
  .msg{position:relative;margin-top:13px;font-size:15px;line-height:1.45;color:#F0EDE8;font-weight:600}
  .mission{position:relative;margin-top:14px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:12px 13px}
  .mlabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8E93B5;font-weight:800}
  .mpct{margin-left:auto;font-size:12px;font-weight:800;color:#1ECBB4}
  .mtext{font-size:13.5px;color:#F0EDE8;font-weight:700;margin:6px 0 10px;line-height:1.3}
  input[type=range]{width:100%;accent-color:#1ECBB4;cursor:pointer}
  .focus{position:relative;margin-top:14px;display:flex;align-items:center;gap:11px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:12px 13px}
  .play{width:30px;height:30px;border-radius:9px;background:rgba(30,203,180,.18);color:#1ECBB4;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .focus .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8E93B5;font-weight:800}
  .focus .v{font-size:13.5px;color:#F0EDE8;font-weight:700;margin-top:2px}
  .pend{position:relative;display:flex;flex-direction:column;gap:7px;margin-top:12px}
  .pr{display:flex;align-items:center;gap:9px;border-radius:12px;padding:9px 11px}
  .pr.warn{background:rgba(232,168,56,.08);border:1px solid rgba(232,168,56,.18)}
  .pr.risk{background:rgba(226,75,74,.08);border:1px solid rgba(226,75,74,.18)}
  .pr span.m{flex:1;font-size:12.5px;font-weight:600;color:#F0EDE8;line-height:1.35}
  .pr span.c{font-size:11px;font-weight:800}
</style></head>
<body>
  <div class="asst">
    <div class="glow"></div>
    <div class="row1"><div class="orb">✦</div><b>O TEU ASSISTENTE</b><span class="tag">Plano de hoje · 8 itens</span></div>
    <p class="msg">Boa energia hoje. Aproveita a manhã para o trabalho mais difícil.</p>
    <div class="mission">
      <div style="display:flex;align-items:center;gap:8px"><span class="mlabel">Missão do dia</span><span class="mpct">40%</span></div>
      <p class="mtext">Fechar a proposta do cliente e enviar até às 18h</p>
      <input type="range" min="0" max="100" step="5" value="40">
    </div>
    <div class="focus"><div class="play">▶</div><div><div class="l">Foco agora</div><div class="v">Começa por: Treino completo</div></div><div style="margin-left:auto;font-size:18px;color:#9BA0B0">›</div></div>
    <div class="pend">
      <div class="pr warn"><span style="font-size:13px">⚠️</span><span class="m">3 hábitos por fazer hoje</span></div>
      <div class="pr risk"><span style="font-size:13px">🔴</span><span class="m">Objetivo "Inglês" parado há 6 dias</span><span class="c" style="color:#E24B4A">Abrir ›</span></div>
    </div>
  </div>
</body></html>
