<h2>Resumo de tasks — v4</h2>
<p class="subtitle">Estilo do primeiro modelo, tudo em lista vertical</p>

<div class="cards">
  <div class="card" data-choice="aprovado" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 20px; background: #0f0f0f; border-radius: 8px;">

      <!-- Header -->
      <div style="text-align:center; margin-bottom: 24px;">
        <div style="font-size: 28px; margin-bottom: 8px;">🌙</div>
        <div style="font-family: sans-serif; font-size: 18px; font-weight: 700; color: #f2f2f2;">Tasks do dia</div>
        <div style="font-size: 13px; color: #666; margin-top: 4px;">Como foi sua execução hoje?</div>
      </div>

      <!-- Contador como lista vertical simples -->
      <div style="display:flex; flex-direction:column; gap: 10px; margin-bottom: 24px;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap: 10px;">
            <span style="font-size:18px; color:#1ecbb4;">✓</span>
            <span style="font-size:14px; color:#ccc;">Feitas</span>
          </div>
          <span style="font-size:22px; font-weight:700; color:#1ecbb4;">3</span>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap: 10px;">
            <span style="font-size:18px; color:#e8a838;">⏭</span>
            <span style="font-size:14px; color:#ccc;">Puladas</span>
          </div>
          <span style="font-size:22px; font-weight:700; color:#e8a838;">1</span>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap: 10px;">
            <span style="font-size:18px; color:#555;">○</span>
            <span style="font-size:14px; color:#ccc;">Não feitas</span>
          </div>
          <span style="font-size:22px; font-weight:700; color:#555;">1</span>
        </div>
      </div>

      <!-- XP total -->
      <div style="text-align:center; padding: 10px; background:rgba(232,168,56,.08); border:0.5px solid rgba(232,168,56,.2); border-radius:10px; margin-bottom:18px;">
        <span style="font-size:13px; color:#e8a838; font-weight:600;">+45 XP em tasks hoje</span>
      </div>

      <!-- Botão -->
      <div style="padding: 14px; background:#7f77dd; border-radius:14px; color:#fff; text-align:center; font-weight:700; font-size:15px;">
        Fechar dia 🌙
      </div>
    </div>
    <div class="card-body">
      <h3>v4 — lista vertical limpa</h3>
      <p>Ícone + label + número. Sem boxes, sem separadores. Lista arejada.</p>
    </div>
  </div>
</div>
